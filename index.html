<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supabase Mini Test - 30 MCQs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#22c55e;
  --g-dark:#15803d;
  --g-deep:#14532d;
  --g-soft:#dcfce7;
  --g-line:#bbf7d0;
  --g-shade:#86efac;
  --mint:#f0fdf4;
  --white:#ffffff;
  --text:#14392a;
  --muted:#5b8a72;
  --bad:#f43f5e;
  --bad-bg:#fff1f3;
  --bad-line:#fecdd3;
  --sun:#fde68a;
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background-color:var(--mint);
  background-image:
    radial-gradient(circle at 1px 1px, var(--g-line) 2px, transparent 2.5px);
  background-size:28px 28px;
  min-height:100vh;
  line-height:1.5;
  padding:20px 14px 70px;
}
.wrap{max-width:700px;margin:0 auto;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.hidden{display:none !important}
code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.86em;
  background:var(--g-soft);
  color:var(--g-deep);
  border-radius:8px;
  padding:1px 7px;
  white-space:nowrap;
}

/* ---------- cards & buttons ---------- */
.card{
  background:var(--white);
  border:3px solid var(--g-line);
  border-radius:var(--radius);
  box-shadow:0 7px 0 var(--g-line);
  padding:22px;
}
.btn{
  background:var(--g);
  color:#fff;
  border:none;
  border-radius:999px;
  box-shadow:0 5px 0 var(--g-dark);
  padding:13px 26px;
  font-weight:600;
  font-size:1.05rem;
  transition:transform .1s, box-shadow .1s, filter .1s;
}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 6px 0 var(--g-dark)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--g-dark)}
.btn.white{background:#fff;color:var(--g-dark);border:3px solid var(--g-shade);box-shadow:0 5px 0 var(--g-shade);padding:10px 24px}
.btn.white:active{box-shadow:0 0 0 var(--g-shade)}
.btn.big{width:100%;font-size:1.25rem;padding:16px 24px}

/* ---------- start ---------- */
.hero{text-align:center;position:relative;overflow:hidden}
.mascot{width:96px;height:96px;margin:0 auto 6px;display:block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.hero h1{font-size:clamp(2rem,8vw,3rem);line-height:1.08;font-weight:700;color:var(--g-deep)}
.hero p{margin:10px auto 20px;color:var(--muted);font-size:1.05rem;max-width:520px}
.opt-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font-weight:500;font-size:.98rem;color:var(--g-dark)}
.opt-row input{width:22px;height:22px;accent-color:var(--g)}
.topics-title{margin:26px 4px 12px;font-weight:600;font-size:1.1rem;color:var(--g-deep)}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.topic{
  text-align:left;
  background:#fff;
  border:3px solid var(--g-line);
  border-radius:20px;
  box-shadow:0 5px 0 var(--g-line);
  padding:14px 18px;
  transition:transform .1s, box-shadow .1s, background .15s;
}
.topic:hover{background:var(--g-soft);transform:translateY(-2px);box-shadow:0 7px 0 var(--g-shade)}
.topic:active{transform:translateY(5px);box-shadow:0 0 0 var(--g-line)}
.topic b{display:block;font-size:1.1rem;color:var(--g-deep)}
.topic span{font-size:.9rem;color:var(--muted)}

/* ---------- quiz ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{
  background:#fff;
  border:3px solid var(--g-line);
  border-radius:999px;
  padding:3px 14px;
  font-weight:600;
  font-size:.95rem;
  color:var(--g-dark);
}
.pill.score{background:var(--g);border-color:var(--g);color:#fff}
.bar{height:20px;border-radius:999px;background:#fff;border:3px solid var(--g-line);overflow:hidden;margin-bottom:18px}
.bar i{
  display:block;height:100%;width:0;border-radius:999px;
  background:repeating-linear-gradient(-45deg,var(--g) 0 12px,#34d27b 12px 24px);
  transition:width .35s;
}
.q-text{font-size:clamp(1.2rem,4.8vw,1.5rem);line-height:1.3;font-weight:600;color:var(--g-deep);margin-bottom:14px}
pre.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.92rem;
  line-height:1.55;
  background:#f6fff9;
  color:var(--g-deep);
  border:3px dashed var(--g-shade);
  border-radius:16px;
  padding:12px 14px;
  margin-bottom:16px;
  overflow-x:auto;
  white-space:pre;
}
.options{display:grid;gap:12px}
.option{
  display:flex;align-items:center;gap:12px;
  text-align:left;
  width:100%;
  background:#fff;
  border:3px solid var(--g-line);
  border-radius:18px;
  box-shadow:0 5px 0 var(--g-line);
  padding:12px 14px;
  font-weight:500;
  font-size:1.03rem;
  line-height:1.35;
  transition:transform .1s, box-shadow .1s, background .15s, border-color .15s;
}
.option .letter{
  flex:none;
  width:36px;height:36px;
  display:grid;place-items:center;
  border-radius:50%;
  background:var(--g-soft);
  color:var(--g-dark);
  font-weight:700;
}
.option .mark{margin-left:auto;font-size:1.4rem;font-weight:700}
.option:not(:disabled):hover{background:var(--g-soft);border-color:var(--g-shade);transform:translateY(-2px);box-shadow:0 7px 0 var(--g-shade)}
.option:not(:disabled):active{transform:translateY(5px);box-shadow:0 0 0 var(--g-line)}
.option:disabled{cursor:default}
.option.correct{background:var(--g-soft);border-color:var(--g);box-shadow:0 5px 0 var(--g);animation:pop .35s}
.option.correct .letter{background:var(--g);color:#fff}
.option.correct .mark{color:var(--g-dark)}
.option.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:shake .35s}
.option.wrong .letter{background:var(--bad);color:#fff}
.option.wrong .mark{color:var(--bad)}
.option.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes pop{40%{transform:scale(1.03)}}

.feedback{
  margin-top:20px;
  border-radius:20px;
  padding:14px 16px;
  font-size:1.03rem;
  border:3px solid;
}
.feedback.good{background:var(--g-soft);border-color:var(--g)}
.feedback.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.feedback .head{font-weight:700;font-size:1.15rem;margin-bottom:6px}
.feedback.good .head{color:var(--g-dark)}
.feedback.bad .head{color:var(--bad)}
.feedback .ans{margin-bottom:10px}
.feedback .trick{
  background:#fff;
  border:3px dashed var(--g-shade);
  border-radius:16px;
  padding:10px 14px;
}
.feedback .trick b{display:block;color:var(--g-dark);margin-bottom:2px}
.next-row{margin-top:18px;display:flex;justify-content:flex-end}
.hint{margin-top:16px;font-size:.85rem;color:var(--muted);text-align:center}

/* ---------- result ---------- */
.score-card{text-align:center}
.ring{
  --p:0;
  width:178px;height:178px;border-radius:50%;
  margin:4px auto 14px;
  background:conic-gradient(var(--g) calc(var(--p) * 1%), var(--g-soft) 0);
  display:grid;place-items:center;
  position:relative;
}
.ring::before{content:"";position:absolute;inset:16px;background:#fff;border-radius:50%}
.ring .inner{position:relative;line-height:1}
.ring .inner b{font-size:3.1rem;font-weight:700;color:var(--g-deep)}
.ring .inner small{font-size:1.2rem;color:var(--muted);font-weight:500}
.ring .inner div{margin-top:6px;font-weight:600;color:var(--g-dark)}
.score-card .msg{font-size:1.4rem;font-weight:700;color:var(--g-deep)}
.score-card .sub{color:var(--muted)}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.res-actions .btn:only-child{grid-column:1/-1}
h2.sec{margin:30px 4px 12px;font-size:1.25rem;font-weight:600;color:var(--g-deep)}
.tb{display:grid;gap:12px}
.tb-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:12px;align-items:center;font-size:.98rem;font-weight:500}
.tb-bar{height:16px;border-radius:999px;background:var(--g-soft);overflow:hidden}
.tb-bar i{display:block;height:100%;border-radius:999px;background:var(--g)}
.tb-bar i.mid{background:#facc15}
.tb-bar i.low{background:var(--bad)}
.review{display:grid;gap:14px}
.rev{
  background:#fff;
  border:3px solid var(--bad-line);
  border-radius:20px;
  padding:14px 16px;
}
.rev .rq{font-weight:600;margin-bottom:4px;color:var(--g-deep)}
.rev pre.code{margin:6px 0 10px;font-size:.85rem}
.rev .rs{font-size:.96rem;margin-bottom:8px}
.rev .rs em{font-style:normal;font-weight:700}
.rev .rs .x{color:var(--bad)}
.rev .rs .v{color:var(--g-dark)}
.rev .rt{font-size:.97rem;background:var(--g-soft);border-radius:14px;padding:9px 12px}
.perfect{padding:20px;text-align:center;font-weight:600;font-size:1.15rem;margin-top:26px}

/* confetti */
.confetti{position:fixed;top:-14px;width:10px;height:14px;border-radius:3px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

@media (max-width:520px){
  .card{padding:16px}
  .tb-row{grid-template-columns:1fr auto}
  .tb-row .tb-bar{grid-column:1/-1;order:3}
  .res-actions{grid-template-columns:1fr}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
  .confetti{display:none}
}
</style>
</head>

  <!-- RESULT -->
  <section id="result" class="hidden"></section>

</div>

const $ = id => document.getElementById(id);
const LETTERS = ["A","B","C","D"];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function show(id){
  ["start","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s!==id));
  window.scrollTo({top:0});
}

const ALL = [];
TOPICS.forEach((t,ti) => t.qs.forEach(q => ALL.push({
  topic:ti, q:q[0], opts:q[1], ans:q[2], trick:q[3], code:q[4] || ""
})));

/* ---------------------------------------------------------
   STATE
   --------------------------------------------------------- */
let pool = [], idx = 0, score = 0, locked = false;
let order = [];
let results = [];
let label = "";

/* ---------------------------------------------------------
   START SCREEN
   --------------------------------------------------------- */
function buildTopics(){
  const g = $("topicGrid");
  g.innerHTML = TOPICS.map((t,i) =>
    `<button class="topic" data-t="${i}"><b>${esc(t.name)}</b><span>${t.qs.length} sawal</span></button>`
  ).join("");
  g.querySelectorAll(".topic").forEach(b =>
    b.addEventListener("click", () => start(ALL.filter(x => x.topic === +b.dataset.t), TOPICS[+b.dataset.t].name))
  );
}

function start(items, lbl){
  pool = $("shuffleQs").checked ? shuffle(items) : items.slice();
  label = lbl;
  idx = 0; score = 0; results = [];
  show("quiz");
  render();
}

/* ---------------------------------------------------------
   QUESTION SCREEN
   --------------------------------------------------------- */
function render(){
  locked = false;
  const item = pool[idx];
  order = shuffle(item.opts.map((_,i) => i));

  $("topicPill").textContent = label === "Poora test" ? TOPICS[item.topic].name : label;
  $("counter").textContent = `Sawal ${idx+1} / ${pool.length}`;
  $("scorePill").textContent = `Score: ${score}`;
  $("barFill").style.width = (idx / pool.length * 100) + "%";
  $("qText").innerHTML = fmt(item.q);
  $("codeSlot").innerHTML = item.code ? `<pre class="code">${esc(item.code)}</pre>` : "";

  $("options").innerHTML = order.map((oi,k) =>
    `<button class="option" data-k="${k}">
       <span class="letter">${LETTERS[k]}</span>
       <span class="txt">${fmt(item.opts[oi])}</span>
       <span class="mark"></span>
     </button>`
  ).join("");
  $("options").querySelectorAll(".option").forEach(b =>
    b.addEventListener("click", () => pick(+b.dataset.k))
  );

  const fb = $("feedback");
  fb.className = "feedback hidden";
  fb.innerHTML = "";
  $("nextBtn").classList.add("hidden");
}

function pick(k){
  if(locked) return;
  locked = true;
  const item = pool[idx];
  const correctK = order.indexOf(item.ans);
  const ok = k === correctK;
  if(ok) score++;
  results.push({item, correct:ok, picked:item.opts[order[k]]});

  $("options").querySelectorAll(".option").forEach((b,i) => {
    b.disabled = true;
    const mark = b.querySelector(".mark");
    if(i === correctK){ b.classList.add("correct"); mark.textContent = "\u2713"; }
    else if(i === k){ b.classList.add("wrong"); mark.textContent = "\u2717"; }
    else b.classList.add("dim");
  });

  const fb = $("feedback");
  if(ok){
    fb.className = "feedback good";
    fb.innerHTML = `<div class="head">Sahi jawab! Shabash \u{1F389}</div>`;
  } else {
    fb.className = "feedback bad";
    fb.innerHTML =
      `<div class="head">Oops, galat ho gaya \u{1F648}</div>
       <div class="ans">Sahi jawab: <b>${fmt(item.opts[item.ans])}</b></div>
       <div class="trick"><b>Trick \u{1F331}</b>${fmt(item.trick)}</div>`;
  }
  $("scorePill").textContent = `Score: ${score}`;
  $("barFill").style.width = ((idx+1) / pool.length * 100) + "%";

  const nb = $("nextBtn");
  nb.textContent = idx === pool.length - 1 ? "Result dekho" : "Agla sawal";
  nb.classList.remove("hidden");
  nb.focus({preventScroll:true});
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function next(){
  if(idx === pool.length - 1){ finish(); return; }
  idx++;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------------------------------------------------------
   RESULT SCREEN
   --------------------------------------------------------- */
function confetti(){
  const colors = ["#22c55e","#4ade80","#86efac","#bbf7d0","#fde68a","#fda4af"];
  for(let i=0;i<46;i++){
    const s = document.createElement("span");
    s.className = "confetti";
    s.style.left = Math.random()*100 + "vw";
    s.style.background = colors[i % colors.length];
    s.style.animationDuration = (2.2 + Math.random()*2) + "s";
    s.style.animationDelay = (Math.random()*0.8) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5500);
  }
}

function finish(){
  const total = pool.length;
  const pct = Math.round(score / total * 100);
  let msg, sub;
  if(pct === 100){ msg = "Perfect! Ek bhi galti nahi \u{1F31F}"; sub = "Supabase ke ye topics ekdum pakke hain."; }
  else if(pct >= 80){ msg = "Zabardast! \u{1F389}"; sub = "Bas thori si polish baaki hai."; }
  else if(pct >= 60){ msg = "Acha hai, aur behtar ho sakta hai \u{1F331}"; sub = "Neeche di gayi tricks ek baar parh lo."; }
  else if(pct >= 40){ msg = "Theek-thaak, ugte raho \u{1F33F}"; sub = "Tricks parho aur dobara try karo, score upar jayega."; }
  else { msg = "Koi baat nahi, beej abhi boya hai \u{1F331}"; sub = "Tricks dhyan se parho, phir dobara test do."; }

  const per = {};
  results.forEach(r => {
    const t = r.item.topic;
    per[t] = per[t] || {c:0, n:0};
    per[t].n++; if(r.correct) per[t].c++;
  });
  const rows = Object.keys(per).map(t => {
    const {c,n} = per[t]; const p = Math.round(c/n*100);
    const cls = p >= 80 ? "" : (p >= 50 ? "mid" : "low");
    return `<div class="tb-row"><span>${esc(TOPICS[t].name)}</span>
      <div class="tb-bar"><i class="${cls}" style="width:${p}%"></i></div>
      <span>${c}/${n}</span></div>`;
  }).join("");

  const wrong = results.filter(r => !r.correct);
  const review = wrong.length
    ? `<h2 class="sec">Galat sawal aur unki tricks (${wrong.length})</h2>
       <div class="review">` + wrong.map(r =>
        `<div class="rev">
           <div class="rq">${fmt(r.item.q)}</div>
           ${r.item.code ? `<pre class="code">${esc(r.item.code)}</pre>` : ""}
           <div class="rs"><em class="x">Tumne:</em> ${fmt(r.picked)}<br><em class="v">Sahi:</em> ${fmt(r.item.opts[r.item.ans])}</div>
           <div class="rt"><b>Trick \u{1F331}</b> ${fmt(r.item.trick)}</div>
         </div>`).join("") + `</div>`
    : `<div class="card perfect">Koi galat sawal nahi. Mubarak ho! \u{1F389}</div>`;

  $("result").innerHTML =
    `<div class="card score-card">
       <div class="ring" id="ring"><div class="inner"><b>${score}</b><small>/${total}</small><div>${pct}%</div></div></div>
       <div class="msg">${msg}</div>
       <div class="sub">${sub}</div>
       <div class="res-actions">
         ${wrong.length ? `<button class="btn" id="retryWrong">Sirf galat wale dobara (${wrong.length})</button>` : ""}
         <button class="btn white" id="restart">Shuru se dobara</button>
       </div>
     </div>
     ${Object.keys(per).length > 1 ? `<h2 class="sec">Part ke hisaab se</h2><div class="card"><div class="tb">${rows}</div></div>` : ""}
     ${review}`;

  const rw = $("retryWrong");
  if(rw) rw.addEventListener("click", () => start(wrong.map(r => r.item), "Galat wale"));
  $("restart").addEventListener("click", () => show("start"));
  show("result");

  // animate ring fill
  const ring = $("ring");
  requestAnimationFrame(() => { ring.style.transition = "none"; ring.style.setProperty("--p", pct); });
  if(pct >= 70) confetti();
}

/* ---------------------------------------------------------
   EVENTS
   --------------------------------------------------------- */
$("startAll").addEventListener("click", () => start(ALL, "Poora test"));
$("nextBtn").addEventListener("click", next);

document.addEventListener("keydown", e => {
  if($("quiz").classList.contains("hidden")) return;
  const key = e.key.toLowerCase();
  if(!locked){
    let k = -1;
    if(["1","2","3","4"].includes(key)) k = +key - 1;
    else if(["a","b","c","d"].includes(key)) k = key.charCodeAt(0) - 97;
    if(k >= 0 && k < order.length) pick(k);
  } else if(key === "enter"){
    if(document.activeElement !== $("nextBtn")){ e.preventDefault(); next(); }
  }
});

buildTopics();
</script>
</body>
</html>
